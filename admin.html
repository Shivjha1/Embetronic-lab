<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Embetronic Admin Dashboard</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#07111f;color:#eef6ff}header{padding:22px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #17314c;position:sticky;top:0;background:#07111fee;backdrop-filter:blur(10px);z-index:2}h1{margin:0;font-size:22px}button{cursor:pointer;border:0;border-radius:8px;padding:10px 15px;font-weight:700}.primary{background:#168cff;color:white}.danger{background:#7f2530;color:white}.wrap{max-width:1400px;margin:auto;padding:30px 5%}.login{max-width:430px;margin:8vh auto;background:#0d1d31;border:1px solid #23415d;padding:28px;border-radius:16px;box-shadow:0 20px 60px #0005}label{display:block;margin:15px 0 7px;font-size:13px;color:#a9bfd3}input{width:100%;padding:12px;border-radius:8px;border:1px solid #31516d;background:#081625;color:white}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:20px}.card{background:#0d1d31;border:1px solid #23415d;border-radius:14px;padding:18px}.card b{font-size:26px;display:block;margin-top:5px}.toolbar{display:flex;gap:10px;margin:15px 0}.toolbar input{max-width:400px}.table-wrap{overflow:auto;background:#0d1d31;border:1px solid #23415d;border-radius:14px}table{border-collapse:collapse;width:100%;min-width:1200px}th,td{padding:12px;border-bottom:1px solid #18334d;text-align:left;font-size:13px;vertical-align:top}th{color:#8fc7f5;background:#0a1828;position:sticky;top:0}.muted{color:#8ca4ba}.error{color:#ff8f8f;margin-top:12px}.success{color:#73e3ad;margin-top:12px}@media(max-width:700px){.stats{grid-template-columns:1fr}.toolbar{flex-direction:column}}
</style></head><body><header><h1>⚡ Embetronic Club — Admin Dashboard</h1><button id="logout" class="danger hidden">Logout</button></header>
<div id="loginView" class="login"><h2>Admin Login</h2><p class="muted">Authorized coordinators only.</p><label>Email</label><input id="username" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="login" class="primary" style="width:100%;margin-top:20px">Login</button><div id="loginMsg"></div></div>
<main id="dashboard" class="wrap hidden"><div class="stats"><div class="card">Total Applications<b id="total">0</b></div><div class="card">Individual<b id="individual">0</b></div><div class="card">Teams<b id="teams">0</b></div></div><div class="toolbar"><input id="search" placeholder="Search name, roll, email, phone, interest…"><button id="refresh" class="primary">Refresh</button><button id="csv" class="primary">Export CSV</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Date</th><th>Type</th><th>Name</th><th>Roll</th><th>Year</th><th>Section</th><th>Phone</th><th>Email</th><th>Interest</th><th>Team Members</th><th>Reason</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script src="firebase-config.js"></script><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import {getFirestore,collection,getDocs,query,orderBy} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
const app=initializeApp(window.FIREBASE_CONFIG);const auth=getAuth(app);const db=getFirestore(app);let all=[];const $=id=>document.getElementById(id);function msg(t,ok=false){$('loginMsg').className=ok?'success':'error';$('loginMsg').textContent=t}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('login').onclick=async()=>{if($('username').value.trim().toLowerCase()!==String(window.EMBETRONIC_ADMIN_EMAIL).toLowerCase())return msg('Unauthorized admin email.');$('login').disabled=true;try{await signInWithEmailAndPassword(auth,$('username').value.trim(),$('password').value);msg('Login successful',true)}catch(e){msg(e.message)}finally{$('login').disabled=false}};
async function load(){try{const snap=await getDocs(query(collection(db,'applications'),orderBy('createdAt','desc')));all=snap.docs.map(d=>({id:d.id,...d.data()}));render()}catch(e){msg('Could not load applications: '+e.message)}}
function render(){const q=$('search').value.toLowerCase();const rows=all.filter(r=>Object.values(r).map(v=>typeof v==='object'?JSON.stringify(v):v).join(' ').toLowerCase().includes(q));$('total').textContent=all.length;$('individual').textContent=all.filter(r=>r.type==='Individual').length;$('teams').textContent=all.filter(r=>r.type==='Team').length;$('rows').innerHTML=rows.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.submittedAt||'')}</td><td>${esc(r.type)}</td><td>${esc(r.name)}</td><td>${esc(r.roll)}</td><td>${esc(r.year)}</td><td>${esc(r.section)}</td><td>${esc(r.phone)}</td><td>${esc(r.email)}</td><td>${esc(r.interest)}</td><td>${esc((r.teamMembers||[]).map(m=>m.name+' ('+m.roll+')').join(', '))}</td><td>${esc(r.reason)}</td></tr>`).join('')||'<tr><td colspan="12" class="muted">No applications found.</td></tr>'}
$('search').oninput=render;$('refresh').onclick=load;$('logout').onclick=()=>signOut(auth);$('csv').onclick=()=>{const h=['id','submittedAt','type','name','roll','year','section','phone','email','interest','teamMembers','reason'];const lines=[h.join(','),...all.map(r=>h.map(k=>{let v=k==='teamMembers'?(r.teamMembers||[]).map(m=>m.name+' ('+m.roll+')').join('; '):r[k]??'';return '"'+String(v).replace(/"/g,'""')+'"'}).join(','))];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'}));a.download='embetronic-applications.csv';a.click()};
onAuthStateChanged(auth,user=>{if(user&&user.email.toLowerCase()===String(window.EMBETRONIC_ADMIN_EMAIL).toLowerCase()){$('loginView').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');load()}else{$('dashboard').classList.add('hidden');$('logout').classList.add('hidden');$('loginView').classList.remove('hidden')}});
</script></body></html>
